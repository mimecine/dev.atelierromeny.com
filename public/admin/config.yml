backend:
  name: github
  repo: "mimecine/dev.atelierromeny.com" # The GitHub repository where the content will be stored
  branch: main
  base_url: https://cms-auth.mimecom.workers.dev/

# Media is split in two folders (each shows as its own folder in the media library):
#   src/media/works  - images of works (set on the Works collection below)
#   src/media/assets - everything else: pages, settings, collections
# Paths are stored as /src/media/...; Astro resolves them as local images (and the
# satteri plugin in astro.config.mjs does the same for images inside markdown text).
media_folder: "src/media/assets"
public_folder: "/src/media/assets"
# Uploads are converted to WebP and capped at 3000px before they're saved
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 90
          width: 3000
          height: 3000
      # Camera names (PXL_2026…) become URL-friendly
      slugify_filename: true

collections:
  - name: "works"
    label: "Works"
    label_singular: "Work"
    folder: "src/content/works"
    media_folder: "/src/media/works"
    public_folder: "/src/media/works"
    description: "Each work's page is /works/<slug>/ (\"View on live site\" in the editor). Area and suggested prices are in the [table view](/admin/table/)."
    create: true
    slug: "{{title}}"
    # "View on live site" in the editor. Renaming a work doesn't need redirects here, so
    # don't record old slugs in an `aliases` field.
    preview_path: "/works/{{slug}}/"
    aliases_field: false
    summary: "{{title | default('No title recorded')}} · {{year_start | default('undated')}} · {{w | default('?')}} × {{h | default('?')}} cm · {{rating | default('–')}}★"
    # The list shows the first of these that a work has (Sveltia can't follow `thumbnail`)
    thumbnail: [images.*, old_image]
    sortable_fields:
      fields: [title, year_start, w, rating, categories, commit_date]
      default:
        field: commit_date
        direction: descending
    view_groups:
      - { label: "Category", field: categories }
      - { label: "Rating", field: rating }
      - { label: "Years", field: year_start, pattern: "^[0-9]{4}$" }
      - { label: "Decades", field: year_start, pattern: "^[0-9]{3}" }
      - { label: "Location", field: location }
      - { label: "New Location", field: new_location }
    view_filters:
      - { label: "Rated 4 or 5", field: rating, gte: 4 }
      - { label: "Not rated", field: rating, empty: true }
      - { label: "Missing size", field: w, empty: true }
      - { label: "Works on Paper", field: categories, eq: "Works on Paper" }
      - { label: "Not in any collection", field: collections, empty: true }
      - { label: "No title recorded", field: title, empty: true }
      - { label: "Undated", field: year_start, empty: true }
      - { label: "Unlocated", field: location, empty: true }
      - { label: "Without images", field: images, empty: true }
      - { label: "Has hidden images", field: hidden_images, empty: false }
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - label: "Images"
        name: "images"
        widget: list
        required: false
        hint: "The main photo first. The detail (…-detail.webp: the artwork alone, cut out and straightened, made by scripts/make-details) goes last."
        field:
          label: "Image"
          name: "image"
          widget: "image"
          media_libraries: { default: { config: { filename_template: "{{slug}}-{{uuid_short}}" } } }
      - label: "Hidden Images"
        name: "hidden_images"
        widget: list
        required: false
        hint: "Pick any of the images above to keep them on file but leave them off the site."
        field: { label: "Image", name: "image", widget: "image" }
      - { label: "Thumbnail", name: "thumbnail", widget: "number", value_type: "int", min: 1, required: false, hint: "Which of the images to use in grids and search: 1 = the first, 2 = the second, and so on. Empty means the first." }
      - { label: "Cleanest photo (for scripts)", name: "cleanest", widget: "string", required: false, hint: "Path of the photo the measuring and detail scripts use, e.g. /src/media/works/127-…-2.webp. It can be a hidden one. Easiest set with the Cleanest checkbox in the table view." }
      - { label: "Old Image (shown only if there are no other images)", name: "old_image", widget: "image", required: false }
      - { label: "Width (cm)", name: "w", widget: "number", value_type: "float", required: false, hint: "The table view (/admin/table) shows the area and a suggested price worked out from width × height." }
      - { label: "Height (cm)", name: "h", widget: "number", value_type: "float", required: false }
      - { label: "Rating", name: "rating", widget: "number", value_type: "int", min: 1, max: 5, required: false, hint: "1 to 5, for pricing and selection. Not shown on the site." }
      - { label: "Sheet Width (cm)", name: "sheet_w", widget: "number", value_type: "float", required: false, hint: "Works on paper: the sheet. Width/Height is the image (plate)." }
      - { label: "Sheet Height (cm)", name: "sheet_h", widget: "number", value_type: "float", required: false }
      - { label: "Year", name: "year", widget: "string", required: false }
      - { label: "Year Start", name: "year_start", widget: "number", required: false }
      - { label: "Year End", name: "year_end", widget: "number", required: false }

      - { label: "Edition", name: "edition", widget: "string", required: false, hint: "As pencilled on a print, e.g. 4/20, III/XV or e.a. (artist's proof)" }
      - { label: "Collections", name: "collections", widget: "relation", collection: "collections",  multiple: true, required: false }
      - { label: "Categories", name: "categories", widget: "string", required: false }
      - label: "Tags"
        name: "tags"
        widget: list
        required: false
        field: { label: "Tag", name: "tag", widget: "string" }
      - { label: "Published", name: "published", widget: "boolean", default: true }
      - { label: "Description", name: "body", widget: "markdown", required: false }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "New Location", name: "new_location", widget: "string", required: false }
      - { label: "Notes", name: "note", widget: "text", required: false }
      - { label: "Work ID", name: "id", widget: "number", value_type: "int", required: false }

  - name: "collections"
    label: "Collections"
    description: "Groups of works. Published ones get a page at /<slug>/; add them to Settings > Site Menu to show them in the menu."
    folder: "src/content/collections"
    create: true
    slug: "{{title}}"

    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - { label: "Published", name: "published", widget: "boolean", default: false }
      - { label: "Shown In Menu", name: "inmenu", widget: "boolean", default: false}
      - { label: "Featured Image (Currently Unused)", name: "image", widget: "image", required: false }
      - { label: "Description", name: "body", widget: "markdown", required: false }
      - { label: "Notes", name: "notes", widget: "text", required: false }

  - name: "pages"
    label: "Pages"
    folder: "src/content/pages"
    create: true
    slug: "{{title}}"
    identifier_field: "title"
    description: "Text pages such as Bio and About, at /<slug>/."
    preview_path: "/{{slug}}/"
    aliases_field: false
    editor:
      preview: true
    fields:
      - { label: "Title", name: "title", widget: "string", required: true, xpreview: false }
      - { label: "Published", name: "published", widget: "boolean", default: true, xpreview: false }
      - { label: "Content", name: "body", widget: "markdown", required: false }
      - { label: "Side Image (floats right of the text)", name: "image", widget: "image", required: false, preview: false }
      - label: "Tags"
        name: "tags"
        widget: list
        required: false
        preview: false
        field: { label: "Tag", name: "tag", widget: "string" }
      - { label: "Notes (Internal)", name: "note", widget: "text", required: false, preview: false }
      - { label: "Extra CSS", name: "css", widget: "text", hint: "Don't forget !important if needed. TailwindCSS @apply works.", required: false, preview: false }
      - { label: "Extra JS", name: "js", widget: "text", required: false, preview: false }


  - name: "photos"
    label: "Photos"
    label_singular: "Photo"
    folder: "src/content/photos"
    media_folder: "/src/media/photos"
    public_folder: "/src/media/photos"
    create: true
    slug: "{{title}}"
    identifier_field: "title"
    description: "Shown on /photos/, newest first."
    summary: "{{title}} · {{date | date('D MMM YYYY')}}"
    preview_path: "/photos/{{slug}}/"
    aliases_field: false
    sortable_fields:
      fields: [title, date, commit_date]
      default:
        field: date
        direction: descending
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - { label: "Photo", name: "image", widget: "image", required: true }
      - { label: "Caption", name: "caption", widget: "string", required: false, hint: "One line, shown under the photo" }
      - { label: "Date", name: "date", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, hint: "Newest first on /photos/" }
      - { label: "Published", name: "published", widget: "boolean", default: true }
      - { label: "Description", name: "body", widget: "markdown", required: false }

  - name: "settings"
    label: "Settings"
    editor:
      preview: false
    files:
      - file: "src/content/settings/home.yml"
        label: "Home Sections"
        name: "home"
        fields:
          - label: "Sections"
            label_singular: "Section"
            name: "sections"
            widget: "list"
            hint: "The front page, top to bottom"
            types:
              - label: "Selected Works"
                name: "works"
                widget: object
                summary: "{{fields.title}}"
                fields:
                  - { label: Title, name: title, widget: string, default: "Selected Works" }
                  - { label: "Show Header", name: show_title, widget: boolean, default: true }
                  - { label: "Works", name: works, widget: relation, collection: "works", multiple: true, search_fields: ["title", "id"], display_fields: ["title", "year_start"], value_field: "{{slug}}", hint: "Shown in this order" }
                  - { label: "Columns", name: columns, widget: select, options: [2, 3, 4, 5, 6], default: 3, hint: "On phones at most 2" }
                  - { label: "Hide?", name: hidden, widget: boolean, default: false }
              - label: "Collection"
                name: "collection"
                widget: object
                summary: "{{fields.title}}"
                fields:
                  - { label: Title, name: title, widget: string, default: "Collection" }
                  - { label: "Collection", name: collection, widget: relation, collection: "collections", required: true }
                  - { label: "Show Header", name: show_title, widget: boolean, default: true }
                  - { label: "Columns", name: columns, widget: select, options: [2, 3, 4, 5, 6], default: 3, hint: "On phones at most 2" }
                  - { label: "Number of works", name: limit, widget: number, value_type: int, min: 0, default: 0, required: false, hint: "0 shows them all. When some are left out, a 'See all' link is added." }
                  - { label: "Order", name: sort, widget: select, default: "title", options: [{ label: "By title", value: "title" }, { label: "Newest first", value: "newest" }, { label: "Oldest first", value: "oldest" }] }
                  - { label: "'See all' link text", name: more_label, widget: string, required: false, hint: "Default: See all <number>" }
                  - { label: "Max Rows (old)", name: max_rows, widget: number, value_type: int, min: 0, required: false, hint: "Used only when Number of works is 0" }
                  - { label: "Hide?", name: hidden, widget: boolean, default: false }
              - label: "Tag"
                name: "tag"
                widget: object
                summary: "{{fields.title}} ({{fields.tag}})"
                fields:
                  - { label: Title, name: title, widget: string, required: false, hint: "Default: the tag" }
                  - { label: "Tag", name: tag, widget: string, required: true, hint: "As used on works, e.g. landscape" }
                  - { label: "Show Header", name: show_title, widget: boolean, default: true }
                  - { label: "Columns", name: columns, widget: select, options: [2, 3, 4, 5, 6], default: 3, hint: "On phones at most 2" }
                  - { label: "Number of works", name: limit, widget: number, value_type: int, min: 0, default: 0, required: false, hint: "0 shows them all. When some are left out, a 'See all' link is added." }
                  - { label: "Order", name: sort, widget: select, default: "title", options: [{ label: "By title", value: "title" }, { label: "Newest first", value: "newest" }, { label: "Oldest first", value: "oldest" }] }
                  - { label: "'See all' link text", name: more_label, widget: string, required: false, hint: "Default: See all <number>" }
                  - { label: "Hide?", name: hidden, widget: boolean, default: false }
              - label: "Featured Work"
                name: "featured"
                widget: object
                summary: "{{fields.title}}"
                fields:
                  - { label: Title, name: title, widget: string, required: false, hint: "Only shown if Show Header is on" }
                  - { label: "Show Header", name: show_title, widget: boolean, default: false }
                  - { label: "Work", name: work, widget: relation, collection: "works", search_fields: ["title", "id"], display_fields: ["title", "year_start"], value_field: "{{slug}}" }
                  - { label: Text, name: text, widget: markdown, required: false }
                  - { label: "Image side", name: image_side, widget: select, default: "left", options: ["left", "right"] }
                  - { label: "Link text", name: more_label, widget: string, required: false, hint: "Default: View the work" }
                  - { label: "Hide?", name: hidden, widget: boolean, default: false }
              - label: "Carousel"
                name: "carousel"
                widget: object
                summary: "{{fields.title}}"
                fields:
                  - { label: Title, name: title, widget: string, default: "Image Gallery" }
                  - { label: "Show Header", name: show_title, widget: boolean, default: false }
                  - label: Images
                    name: images
                    widget: list
                    field: { label: Image, name: image, widget: image }
                  - { label: "Visible at a time", name: visible, widget: select, options: [1, 2, 3], default: 1, hint: "Phones always show 1, tablets at most 2" }
                  - { label: "Height (% of screen height)", name: height, widget: number, value_type: int, min: 20, max: 100, default: 60 }
                  - { label: "Play automatically", name: autoplay, widget: boolean, default: true }
                  - { label: "Seconds per slide", name: interval, widget: number, value_type: int, min: 2, max: 30, default: 5, required: false }
                  - { label: "Hide?", name: hidden, widget: boolean, default: false }
              - label: "Large Image"
                name: "image"
                widget: object
                summary: "{{fields.title}}"
                fields:
                  - { label: Title, name: title, widget: string, default: "Image", hint: "Only shown if Show Header is on" }
                  - { label: "Show Header", name: show_title, widget: boolean, default: false }
                  - { label: Image, name: image, widget: image }
                  - { label: Caption, name: caption, widget: text, required: false }
                  - { label: "Link (optional)", name: href, widget: string, required: false }
                  - { label: "Hide?", name: hidden, widget: boolean, default: false }
              - label: "Text & Image"
                name: "textimage"
                widget: object
                summary: "{{fields.header}}"
                fields:
                  - { label: Header, name: header, widget: string, required: false }
                  - { label: "Show Header", name: show_title, widget: boolean, default: true }
                  - { label: Image, name: image, widget: image, required: false }
                  - { label: Caption, name: caption, widget: string, required: false }
                  - { label: "Image side", name: image_side, widget: select, default: "left", options: ["left", "right"] }
                  - { label: Text, name: text, widget: markdown, required: false }
                  - { label: "Hide?", name: hidden, widget: boolean, default: false }
              - label: "Quote"
                name: "quote"
                widget: object
                summary: "{{fields.attribution}}"
                fields:
                  - { label: Quote, name: quote, widget: text }
                  - { label: "Who said it", name: attribution, widget: string, required: false }
                  - { label: "Hide?", name: hidden, widget: boolean, default: false }
              - label: "Call to Action"
                name: "cta"
                widget: object
                summary: "{{fields.header}}"
                fields:
                  - { label: Header, name: header, widget: string, required: false }
                  - { label: Text, name: text, widget: markdown, required: false }
                  - { label: "Button text", name: button_label, widget: string, required: false, hint: "e.g. Get in touch" }
                  - { label: "Button link", name: button_href, widget: string, required: false, hint: "/bio, https://… or mailto:…" }
                  - { label: "Hide?", name: hidden, widget: boolean, default: false }
              - label: "Divider"
                name: "divider"
                widget: object
                summary: "{{fields.style}}, {{fields.size}}"
                fields:
                  - { label: Style, name: style, widget: select, default: "line", options: [{ label: "Line", value: "line" }, { label: "Space only", value: "space" }] }
                  - { label: Size, name: size, widget: select, default: "medium", options: ["small", "medium", "large"] }
                  - { label: "Hide?", name: hidden, widget: boolean, default: false }
              - label: "Free Content Section"
                name: "content"
                widget: object
                summary: "{{fields.header}}"
                fields:
                  - { label: Header, name: header, widget: string, required: false }
                  - { label: "Show Header", name: show_title, widget: boolean, default: true }
                  - { label: Content, name: text, widget: markdown, required: false }
                  - { label: Columns, name: columns, widget: select, options: [1, 2, 3], default: 1, hint: "Text flows into this many columns on wide screens" }
                  - { label: "Hide Section", name: hidden, widget: boolean, default: false }

      - file: "src/content/settings/navigation.yml"
        label: "Navigation"
        name: "navigation"
        fields:
          - label: "Menu"
            label_singular: "Menu Item"
            name: "menu"
            widget: list
            hint: "Links in the header, left to right. Collections linked here are the ones open to search engines."
            fields:
              - { label: "Title", name: "title", widget: string, required: true }
              - { label: "Url", name: "href", widget: string, required: true, hint: "e.g. /selected-paintings or /bio" }

      - file: "src/content/settings/footer.yml"
        label: "Footer"
        name: "footer"
        fields:
          - label: "Footer Links"
            label_singular: "Footer Link"
            hint: "Shown in a row just above the copyright"
            name: "socials"
            widget: list
            required: false
            fields:
              - { label: "Name (e.g. Instagram)", name: "title", widget: string }
              - { label: "URL", name: "href", widget: string, hint: "https://… or mailto:…" }
          - { label: "Copyright", name: "copyright", widget: "string", required: false, hint: "Not shown yet: the footer reads “© <year> Atelier Romeny”" }

      - file: "src/content/settings/parameters.yml"
        label: "Parameters"
        name: "parameters"
        fields:
          - label: "Password"
            name: "password"
            widget: object
            collapsed: true
            hint: "Keeps casual visitors out while the site is being built. Not real security: the password is in the page source."
            fields:
              - { label: "Require password", name: enabled, widget: boolean, default: false }
              - { label: Password, name: password, widget: string, required: false, hint: "Changing it logs everyone out" }
              - { label: "Remember for (days)", name: days, widget: number, value_type: int, min: 1, default: 7 }
              - { label: "Text under the password field", name: text, widget: markdown, required: false }
          - label: "Pricing"
            name: "pricing"
            widget: object
            collapsed: true
            hint: "Suggested prices in the table view (/admin/table); never shown on the site."
            fields:
              - { label: "Price per m² (€)", name: "price_per_m2", widget: "number", value_type: "float", min: 0, default: 2000, hint: "Base price = width × height (m²) × this." }
              - { label: "Rating step (%)", name: "rating_step_percent", widget: "number", value_type: "float", min: 0, default: 20, hint: "Each star above or below 3 moves the suggested price by this much: with 20%, rating 5 = base +40%, rating 1 = base −40%. No rating = base price." }
          - label: "SEO & Analytics"
            name: "seo"
            widget: object
            collapsed: true
            fields:
              - { label: "Description", name: "description", widget: "text", required: false, hint: "Used by search engines and link previews when a page has no text of its own" }
              - { label: "Sharing Image", name: "share_image", widget: "image", required: false, hint: "Shown when a link to the site is shared (Facebook, X, messages). Work, collection and page links use their own image." }
              - { label: "Google Analytics", name: "ga", widget: "string", required: false, hint: "Measurement ID (G-XXXXXXXXXX). Leave empty to turn tracking off.", pattern: ["^(G-[A-Z0-9]+)?$", "Should look like G-XXXXXXXXXX"] }
              - { label: "Site Title", name: "site_title", widget: "string", required: false, hint: "Not used yet" }
              - { label: "Author", name: "author", widget: "string", required: false, hint: "Not used yet" }
              - { label: "Email", name: "email", widget: "string", required: false, hint: "Not used yet" }
          - label: "Photos in grids"
            name: "photos"
            widget: object
            collapsed: true
            fields:
              - { label: "One photo after every … works", name: every, widget: number, value_type: int, min: 0, default: 12, hint: "A random photo (from Photos) is mixed into collection pages, two columns wide. 0 turns it off." }
          - label: "Advanced"
            name: "advanced"
            widget: object
            collapsed: true
            fields:
              - { label: "Extra CSS (site-wide)", name: "css", widget: "text", required: false, hint: "Not used yet. Pages have their own Extra CSS." }
              - { label: "Extra JS (site-wide)", name: "js", widget: "text", required: false, hint: "Not used yet. Pages have their own Extra JS." }
